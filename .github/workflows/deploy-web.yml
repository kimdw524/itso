name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'packages/eslint-config/**'
      - 'packages/postcss-hover-fallback/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read
  packages: write

env:
  APP_NAME: itso-web
  APP_DIR: apps/web
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image tags
        id: image
        run: |
          IMAGE_NAME="$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "web_env=${{ secrets.WEB_ENV }}"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            APP_NAME="${{ env.APP_NAME }}"
            BASE="/srv/$APP_NAME"
            IMAGE="${{ steps.image.outputs.image_tag }}"

            sudo mkdir -p "$BASE"
            sudo tee "$BASE/.env" >/dev/null <<'WEB_ENV_EOF'
            ${{ secrets.WEB_ENV }}
            WEB_ENV_EOF
            sudo chmod 600 "$BASE/.env"

            echo "${{ github.token }}" | sudo docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
            sudo docker pull "$IMAGE"

            sudo docker rm -f "$APP_NAME" >/dev/null 2>&1 || true
            sudo docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              --network host \
              --env-file "$BASE/.env" \
              "$IMAGE"

            sudo docker image prune -f
